<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlantCare+ | Your Green Oasis</title>
    <!-- # create a premium plant care reminder with glassmorphism design -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #22c55e;
            --primary-glow: rgba(34, 197, 94, 0.4);
            --bg: #052e16;
            --surface: rgba(20, 83, 45, 0.7);
            --text: #f0fdf4;
            --text-muted: #86efac;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --danger: #ef4444;
            --warning: #f59e0b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            background-image: 
                radial-gradient(at 0% 0%, hsla(142,76%,10%,1) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(160,84%,15%,1) 0, transparent 50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
        }

        .container {
            width: 100%;
            max-width: 1000px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3rem;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -0.05em;
        }

        .accent { color: var(--primary); }

        .glass-panel {
            background: var(--glass);
            backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            padding: 2rem;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 2rem;
        }

        /* # create form to add plants with watering schedules */
        .add-plant-form {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        label {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        input, textarea, select {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 12px 16px;
            color: white;
            outline: none;
            transition: all 0.2s;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px var(--primary-glow);
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 14px 0 var(--primary-glow);
            transition: all 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px 0 var(--primary-glow);
        }

        /* # view plants due for watering with status indicators */
        .plant-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .plant-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem;
            background: rgba(255,255,255,0.03);
            border-radius: 20px;
            border: 1px solid var(--glass-border);
        }

        /* # overdue watering alerts with high visibility */
        .overdue {
            border-left: 4px solid var(--danger);
        }

        .status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
        }

        .status-ok { background: rgba(34, 197, 94, 0.2); color: #4ade80; }
        .status-warning { background: rgba(239, 68, 68, 0.2); color: #f87171; }

        /* # create an alert banner for overdue watering notifications */
        .alert-banner {
            width: 100%;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #f87171;
            padding: 12px;
            text-align: center;
            border-radius: 12px;
            margin-bottom: 2rem;
            display: none;
            font-weight: 600;
        }

        /* # create interactive care notes and history modal window */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal {
            width: 90%;
            max-width: 500px;
            background: #052e16; /* Fallback for blur */
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 2rem;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .history-list {
            margin-top: 1rem;
            max-height: 200px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .history-item {
            font-size: 0.85rem;
            color: var(--text-muted);
            padding: 8px;
            border-bottom: 1px solid var(--glass-border);
        }
    </style>
</head>
<body>
    <div id="modal-overlay" class="modal-overlay">
        <div class="modal glass-panel">
            <h2 id="modal-title">Plant Details</h2>
            <div style="margin-top: 1.5rem;">
                <label>Care Notes</label>
                <textarea id="modal-notes" rows="4" style="width: 100%; margin-top: 0.5rem;"></textarea>
            </div>
            <div style="margin-top: 1.5rem;">
                <label>Watering History Log</label>
                <div id="history-list" class="history-list"></div>
            </div>
            <div style="margin-top: 2rem; display: flex; gap: 10px;">
                <button class="btn" style="flex: 1;" onclick="saveModal()">Save Changes</button>
                <button class="btn" style="flex: 1; background: rgba(255,255,255,0.1); box-shadow: none;" onclick="closeModal()">Close</button>
            </div>
        </div>
    </div>
    <div class="container">
        <div id="overdue-banner" class="alert-banner">
            ⚠️ Attention: Some plants are overdue for watering!
        </div>
        <header>
            <h1>PlantCare<span class="accent">+</span></h1>
            <div id="date-display" class="glass-panel" style="padding: 10px 20px; border-radius: 16px;"></div>
        </header>

        <main class="grid">
            <aside class="glass-panel">
                <h2 style="margin-bottom: 1.5rem;">Add New Plant</h2>
                <form id="plant-form" class="add-plant-form">
                    <div class="form-group">
                        <label>Plant Name</label>
                        <input type="text" id="plant-name" placeholder="e.g. Monstera Deliciosa" required>
                    </div>
                    <div class="form-group">
                        <label>Watering Interval (Days)</label>
                        <input type="number" id="water-interval" min="1" placeholder="e.g. 7" required>
                    </div>
                    <!-- # add care notes per plant for specific instructions -->
                    <div class="form-group">
                        <label>Care Notes</label>
                        <textarea id="care-notes" rows="3" placeholder="Indirect sunlight, mist twice weekly..."></textarea>
                    </div>
                    <button type="submit" class="btn">Add to Collection</button>
                </form>
            </aside>

            <section class="glass-panel">
                <h2 style="margin-bottom: 1.5rem;">My Collection</h2>
                <!-- # view plants due for watering sorted by urgency -->
                <div id="plant-list" class="plant-list">
                    <!-- Plants will be injected here -->
                </div>
            </section>
        </main>
    </div>

    <script>
        // # create a centralized data management system for plants
        // # save plant data to file using localStorage for persistence
        
        let plants = JSON.parse(localStorage.getItem('plant-data') || '[]');
        let currentModalIndex = -1;

        const form = document.getElementById('plant-form');
        const list = document.getElementById('plant-list');
        const modal = document.getElementById('modal-overlay');
        const overdueBanner = document.getElementById('overdue-banner');

        function updateList() {
            list.innerHTML = '';
            let anyOverdue = false;

            if (plants.length === 0) {
                list.innerHTML = '<p style="color: var(--text-muted); text-align: center; padding: 2rem;">No plants added yet. Start your garden!</p>';
                overdueBanner.style.display = 'none';
                return;
            }

            // # sort plants by next watering date to prioritize attention
            plants.sort((a, b) => new Date(a.nextWater) - new Date(b.nextWater));

            plants.forEach((plant, index) => {
                const now = new Date();
                const nextWater = new Date(plant.nextWater);
                const isOverdue = nextWater < now;
                if (isOverdue) anyOverdue = true;

                const card = document.createElement('div');
                card.className = `plant-card ${isOverdue ? 'overdue' : ''}`;
                card.style.cursor = 'pointer';
                card.onclick = (e) => {
                    if (e.target.tagName !== 'BUTTON') openModal(index);
                };
                
                card.innerHTML = `
                    <div>
                        <h3 style="margin-bottom: 4px;">${plant.name}</h3>
                        <p style="font-size: 0.85rem; color: var(--text-muted);">
                            Next watering: ${nextWater.toLocaleDateString()}
                        </p>
                    </div>
                    <div style="display: flex; align-items: center; gap: 15px;">
                        <span class="status-badge ${isOverdue ? 'status-warning' : 'status-ok'}">
                            ${isOverdue ? 'Needs Water' : 'Hydrated'}
                        </span>
                        <!-- # watering history log will be updated via this action -->
                        <button class="btn" style="padding: 8px 16px; font-size: 0.85rem;" onclick="waterPlant(event, ${index})">Water</button>
                        <button style="background: none; border: none; color: var(--text-muted); cursor: pointer;" onclick="deletePlant(event, ${index})">✕</button>
                    </div>
                `;
                list.appendChild(card);
            });

            overdueBanner.style.display = anyOverdue ? 'block' : 'none';
        }

        // # create interactive care notes modal
        function openModal(index) {
            currentModalIndex = index;
            const plant = plants[index];
            document.getElementById('modal-title').innerText = plant.name;
            document.getElementById('modal-notes').value = plant.notes || '';
            
            const historyList = document.getElementById('history-list');
            historyList.innerHTML = '';
            
            if (plant.history && plant.history.length > 0) {
                // # watering history log view in reverse chronological order
                [...plant.history].reverse().forEach(date => {
                    const item = document.createElement('div');
                    item.className = 'history-item';
                    item.innerText = `Watered on: ${new Date(date).toLocaleString()}`;
                    historyList.appendChild(item);
                });
            } else {
                historyList.innerHTML = '<p style="color: var(--text-muted); font-size: 0.85rem;">No history yet.</p>';
            }
            
            modal.style.display = 'flex';
        }

        function closeModal() {
            modal.style.display = 'none';
        }

        function saveModal() {
            if (currentModalIndex > -1) {
                plants[currentModalIndex].notes = document.getElementById('modal-notes').value;
                save();
                updateList();
                closeModal();
            }
        }

        form.onsubmit = (e) => {
            e.preventDefault();
            const name = document.getElementById('plant-name').value;
            const interval = parseInt(document.getElementById('water-interval').value);
            const notes = document.getElementById('care-notes').value;

            const nextWater = new Date();
            nextWater.setDate(nextWater.getDate() + interval);

            const newPlant = {
                id: Date.now(),
                name,
                interval,
                notes,
                lastWatered: new Date().toISOString(),
                nextWater: nextWater.toISOString(),
                history: []
            };

            plants.push(newPlant);
            save();
            updateList();
            form.reset();
        };

        function waterPlant(e, index) {
            e.stopPropagation();
            const plant = plants[index];
            const now = new Date();
            
            // # log watering history for tracking health over time
            if (!plant.history) plant.history = [];
            plant.history.push(now.toISOString());
            plant.lastWatered = now.toISOString();
            
            const nextWater = new Date();
            nextWater.setDate(now.getDate() + plant.interval);
            plant.nextWater = nextWater.toISOString();
            
            save();
            updateList();
        }

        function deletePlant(e, index) {
            e.stopPropagation();
            if (confirm(`Delete ${plants[index].name}?`)) {
                plants.splice(index, 1);
                save();
                updateList();
            }
        }

        function save() {
            localStorage.setItem('plant-data', JSON.stringify(plants));
        }

        // Initialize
        document.getElementById('date-display').innerText = new Date().toDateString();
        updateList();
    </script>
</body>
</html>
